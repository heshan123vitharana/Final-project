<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 10px; }
        .image-item { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .image-item img { max-width: 100%; height: 150px; object-fit: cover; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-left: 3px solid #007cba; }
    </style>
</head>
<body>
    <h1>Gallery API Test Page</h1>
    
    <div class="test-section">
        <h2>Backend Server Status</h2>
        <button onclick="testServerConnection()">Test Server Connection</button>
        <div id="serverStatus"></div>
    </div>

    <div class="test-section">
        <h2>Gallery Images</h2>
        <button onclick="fetchGalleryImages()">Fetch Gallery Images</button>
        <div id="imageResults"></div>
        <div id="imageGrid" class="image-grid"></div>
    </div>

    <div class="test-section">
        <h2>Upload Test Image</h2>
        <input type="file" id="imageFile" accept="image/*">
        <input type="text" id="imageTitle" placeholder="Image title" value="Test Image">
        <button onclick="uploadTestImage()">Upload Image</button>
        <div id="uploadResults"></div>
    </div>

    <div class="test-section">
        <h2>API Test Log</h2>
        <div id="apiLog"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('apiLog');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            logDiv.innerHTML += `<div class="log ${className}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function testServerConnection() {
            const statusDiv = document.getElementById('serverStatus');
            try {
                log('Testing server connection...');
                const response = await fetch(`${API_BASE}/gallery`);
                if (response.ok) {
                    statusDiv.innerHTML = '<span class="success">✅ Server is responding</span>';
                    log('Server connection successful', 'success');
                } else {
                    statusDiv.innerHTML = '<span class="error">❌ Server error: ' + response.status + '</span>';
                    log(`Server error: ${response.status}`, 'error');
                }
            } catch (error) {
                statusDiv.innerHTML = '<span class="error">❌ Server not reachable: ' + error.message + '</span>';
                log(`Connection error: ${error.message}`, 'error');
            }
        }

        async function fetchGalleryImages() {
            const resultsDiv = document.getElementById('imageResults');
            const gridDiv = document.getElementById('imageGrid');
            
            try {
                log('Fetching gallery images...');
                const response = await fetch(`${API_BASE}/gallery`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log(`Received ${data.data?.length || 0} images from API`, 'success');
                
                resultsDiv.innerHTML = `<span class="success">✅ Found ${data.data?.length || 0} images</span>`;
                
                // Display images
                if (data.data && data.data.length > 0) {
                    gridDiv.innerHTML = data.data.map(image => `
                        <div class="image-item">
                            <img src="${image.image_url || '/placeholder.jpg'}" 
                                 alt="${image.title || 'Untitled'}" 
                                 onerror="this.src='/placeholder.jpg'; this.alt='Image failed to load';">
                            <h4>${image.title || 'Untitled'}</h4>
                            <p>ID: ${image.id}</p>
                            <p>Category: ${image.category || 'N/A'}</p>
                            <p>Active: ${image.is_active ? 'Yes' : 'No'}</p>
                            <p>Status: ${image.status || 'N/A'}</p>
                            <p>Data URL Length: ${image.image_url ? image.image_url.length : 0}</p>
                        </div>
                    `).join('');
                } else {
                    gridDiv.innerHTML = '<p>No images found in gallery</p>';
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                log(`Error fetching images: ${error.message}`, 'error');
                gridDiv.innerHTML = '';
            }
        }

        async function uploadTestImage() {
            const fileInput = document.getElementById('imageFile');
            const titleInput = document.getElementById('imageTitle');
            const resultsDiv = document.getElementById('uploadResults');
            
            if (!fileInput.files[0]) {
                resultsDiv.innerHTML = '<span class="error">❌ Please select an image file</span>';
                return;
            }
            
            const formData = new FormData();
            formData.append('image', fileInput.files[0]);
            formData.append('title', titleInput.value || 'Test Image');
            formData.append('category', 'Test');
            formData.append('is_active', 'true');
            
            try {
                log(`Uploading image: ${fileInput.files[0].name}...`);
                const response = await fetch(`${API_BASE}/gallery`, {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultsDiv.innerHTML = `<span class="success">✅ Image uploaded successfully! ID: ${data.data?.id}</span>`;
                    log(`Image uploaded successfully with ID: ${data.data?.id}`, 'success');
                    // Refresh the gallery
                    fetchGalleryImages();
                } else {
                    resultsDiv.innerHTML = `<span class="error">❌ Upload failed: ${data.message || 'Unknown error'}</span>`;
                    log(`Upload failed: ${data.message || 'Unknown error'}`, 'error');
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<span class="error">❌ Upload error: ${error.message}</span>`;
                log(`Upload error: ${error.message}`, 'error');
            }
        }

        // Auto-test server connection on page load
        window.onload = function() {
            testServerConnection();
            setTimeout(fetchGalleryImages, 1000);
        };
    </script>
</body>
</html>
