<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ccc; }
        .category-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 15px; margin-top: 10px; }
        .category-item { border: 1px solid #ddd; padding: 15px; }
        .image-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-top: 10px; }
        .image-item { border: 1px solid #ddd; padding: 10px; text-align: center; }
        .image-item img { max-width: 100%; height: 150px; object-fit: cover; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .success { color: green; }
        .error { color: red; }
        .log { background: #f5f5f5; padding: 10px; margin: 10px 0; border-left: 3px solid #007cba; }
    </style>
</head>
<body>
    <h1>Category API Test Page</h1>
    
    <div class="test-section">
        <h2>Categories</h2>
        <button onclick="fetchCategories()">Fetch Categories</button>
        <button onclick="fetchCategoriesWithCounts()">Fetch Categories with Counts</button>
        <div id="categoryResults"></div>
        <div id="categoryGrid" class="category-grid"></div>
    </div>

    <div class="test-section">
        <h2>Create New Category</h2>
        <input type="text" id="categoryName" placeholder="Category name" value="Test Category">
        <input type="text" id="categoryDescription" placeholder="Description" value="Test category description">
        <button onclick="createCategory()">Create Category</button>
        <div id="createResults"></div>
    </div>

    <div class="test-section">
        <h2>Category Images</h2>
        <select id="categorySelect">
            <option value="">Select a category</option>
        </select>
        <button onclick="fetchCategoryImages()">Fetch Category Images</button>
        <div id="imageResults"></div>
        <div id="imageGrid" class="image-grid"></div>
    </div>

    <div class="test-section">
        <h2>API Test Log</h2>
        <div id="apiLog"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';
        
        function log(message, type = 'info') {
            const logDiv = document.getElementById('apiLog');
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : '';
            logDiv.innerHTML += `<div class="log ${className}">[${timestamp}] ${message}</div>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function fetchCategories() {
            const resultsDiv = document.getElementById('categoryResults');
            const gridDiv = document.getElementById('categoryGrid');
            
            try {
                log('Fetching categories...');
                const response = await fetch(`${API_BASE}/categories`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log(`Received ${data.data?.length || 0} categories from API`, 'success');
                
                resultsDiv.innerHTML = `<span class="success">✅ Found ${data.data?.length || 0} categories</span>`;
                
                // Display categories
                if (data.data && data.data.length > 0) {
                    gridDiv.innerHTML = data.data.map(category => `
                        <div class="category-item">
                            <h4>${category.name}</h4>
                            <p><strong>Slug:</strong> ${category.slug}</p>
                            <p><strong>Description:</strong> ${category.description || 'N/A'}</p>
                            <p><strong>Sort Order:</strong> ${category.sort_order}</p>
                            <p><strong>Status:</strong> ${category.is_active ? 'Active' : 'Inactive'}</p>
                            <p><strong>Created:</strong> ${new Date(category.created_at).toLocaleDateString()}</p>
                        </div>
                    `).join('');

                    // Populate category select
                    const categorySelect = document.getElementById('categorySelect');
                    categorySelect.innerHTML = '<option value="">Select a category</option>' +
                        data.data.map(cat => `<option value="${cat.id}">${cat.name}</option>`).join('');
                } else {
                    gridDiv.innerHTML = '<p>No categories found</p>';
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                log(`Error fetching categories: ${error.message}`, 'error');
                gridDiv.innerHTML = '';
            }
        }

        async function fetchCategoriesWithCounts() {
            const resultsDiv = document.getElementById('categoryResults');
            const gridDiv = document.getElementById('categoryGrid');
            
            try {
                log('Fetching categories with counts...');
                const response = await fetch(`${API_BASE}/categories/with-counts`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log(`Received ${data.data?.length || 0} categories with counts from API`, 'success');
                
                resultsDiv.innerHTML = `<span class="success">✅ Found ${data.data?.length || 0} categories with counts</span>`;
                
                // Display categories with counts
                if (data.data && data.data.length > 0) {
                    gridDiv.innerHTML = data.data.map(category => `
                        <div class="category-item">
                            <h4>${category.name}</h4>
                            <p><strong>Slug:</strong> ${category.slug}</p>
                            <p><strong>Description:</strong> ${category.description || 'N/A'}</p>
                            <p><strong>Total Images:</strong> ${category.image_count || 0}</p>
                            <p><strong>Active Images:</strong> ${category.active_image_count || 0}</p>
                            <p><strong>Sort Order:</strong> ${category.sort_order}</p>
                            <p><strong>Status:</strong> ${category.is_active ? 'Active' : 'Inactive'}</p>
                        </div>
                    `).join('');
                } else {
                    gridDiv.innerHTML = '<p>No categories found</p>';
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                log(`Error fetching categories with counts: ${error.message}`, 'error');
                gridDiv.innerHTML = '';
            }
        }

        async function createCategory() {
            const nameInput = document.getElementById('categoryName');
            const descInput = document.getElementById('categoryDescription');
            const resultsDiv = document.getElementById('createResults');
            
            if (!nameInput.value.trim()) {
                resultsDiv.innerHTML = '<span class="error">❌ Category name is required</span>';
                return;
            }
            
            try {
                log(`Creating category: ${nameInput.value}...`);
                const response = await fetch(`${API_BASE}/categories`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        name: nameInput.value.trim(),
                        description: descInput.value.trim() || null
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    resultsDiv.innerHTML = `<span class="success">✅ Category created successfully! ID: ${data.data?.id}</span>`;
                    log(`Category created successfully with ID: ${data.data?.id}`, 'success');
                    // Clear inputs
                    nameInput.value = '';
                    descInput.value = '';
                    // Refresh categories
                    fetchCategories();
                } else {
                    resultsDiv.innerHTML = `<span class="error">❌ Creation failed: ${data.message || 'Unknown error'}</span>`;
                    log(`Category creation failed: ${data.message || 'Unknown error'}`, 'error');
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<span class="error">❌ Creation error: ${error.message}</span>`;
                log(`Category creation error: ${error.message}`, 'error');
            }
        }

        async function fetchCategoryImages() {
            const categorySelect = document.getElementById('categorySelect');
            const resultsDiv = document.getElementById('imageResults');
            const gridDiv = document.getElementById('imageGrid');
            
            if (!categorySelect.value) {
                resultsDiv.innerHTML = '<span class="error">❌ Please select a category</span>';
                return;
            }
            
            try {
                log(`Fetching images for category ${categorySelect.value}...`);
                const response = await fetch(`${API_BASE}/categories/${categorySelect.value}/images`);
                
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                log(`Received ${data.data?.images?.length || 0} images for category`, 'success');
                
                resultsDiv.innerHTML = `<span class="success">✅ Found ${data.data?.images?.length || 0} images in "${data.data?.category?.name || 'Unknown'}" category</span>`;
                
                // Display images
                if (data.data?.images && data.data.images.length > 0) {
                    gridDiv.innerHTML = data.data.images.map(image => `
                        <div class="image-item">
                            <img src="${image.image_url || '/placeholder.jpg'}" 
                                 alt="${image.title || 'Untitled'}" 
                                 onerror="this.src='/placeholder.jpg'; this.alt='Image failed to load';">
                            <h4>${image.title || 'Untitled'}</h4>
                            <p>Status: ${image.is_active ? 'Active' : 'Inactive'}</p>
                            <p>Created: ${new Date(image.created_at).toLocaleDateString()}</p>
                        </div>
                    `).join('');
                } else {
                    gridDiv.innerHTML = '<p>No images found in this category</p>';
                }
                
            } catch (error) {
                resultsDiv.innerHTML = `<span class="error">❌ Error: ${error.message}</span>`;
                log(`Error fetching category images: ${error.message}`, 'error');
                gridDiv.innerHTML = '';
            }
        }

        // Auto-load categories on page load
        window.onload = function() {
            fetchCategories();
        };
    </script>
</body>
</html>
